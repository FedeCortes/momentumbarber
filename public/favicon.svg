<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <rect width="48" height="48" rx="12" fill="#14120F"/>
  <!-- cuerpo del poste -->
  <rect x="17" y="9" width="14" height="30" rx="7" fill="#EDE7D6"/>
  <!-- franjas -->
  <g stroke-linecap="butt" stroke-width="4.4">
    <line x1="17" y1="19" x2="31" y2="9"  stroke="#C39A3F"/>
    <line x1="17" y1="25" x2="31" y2="15" stroke="#8A322D"/>
    <line x1="17" y1="31" x2="31" y2="21" stroke="#C39A3F"/>
    <line x1="17" y1="37" x2="31" y2="27" stroke="#8A322D"/>
    <line x1="23" y1="37" x2="31" y2="33" stroke="#C39A3F"/>
  </g>
  <!-- recorta el excedente de las franjas contra el borde redondeado -->
  <rect x="17" y="9" width="14" height="30" rx="7" fill="none" stroke="#14120F" stroke-width="5"/>
  <!-- tapas y perilla -->
  <rect x="13.5" y="7" width="21" height="6" rx="3" fill="#D9B45C"/>
  <rect x="13.5" y="35" width="21" height="6" rx="3" fill="#D9B45C"/>
  <circle cx="24" cy="4.6" r="3" fill="#D9B45C"/>
</svg>
